<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora IMC</title>
</head>
<body>

    <main>
        <h1>Calculadora IMC</h1>
        <form id="form">
            <div class="field-group">
                <label for="nome">Nome:</label>
                <input id="nome" type="text" placeholder="Insira seu nome">
            </div>

            <div class="field-group">
                <label for="peso">Peso (kg):</label>
                <input id="peso" type="text" placeholder="ex.: 60 ou 60,5">
            </div>

            <div class="field-group">
                <label for="altura">Altura (cm ou m):</label>
                <input id="altura" type="text" placeholder="ex.: 170 ou 1,70">
            </div>

            <div class="actions">
                <button type="submit">Enviar</button>
                <button type="reset" id="btn-limpar">Limpar formulário</button>
            </div>

            <p id="result"></p>
        </form>
    </main>

    <script src="js01.js"></script>
</body>
</html>
